<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PROJECT50 — Yasal / Legal</title>
<style>
:root {
  --bg: #f4f2ed;
  --surface: #ffffff;
  --text: #1c1b19;
  --muted: #6b6760;
  --accent: #9a5b34;
  --line: #e2ded6;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #14130f;
    --surface: #1d1c18;
    --text: #f1efe9;
    --muted: #a09a90;
    --accent: #c98a5e;
    --line: #2e2c26;
  }
}
* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font: 17px/1.65 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  -webkit-text-size-adjust: 100%;
}
main { max-width: 42rem; margin: 0 auto; padding: 3rem 1.25rem 6rem; }
header { margin-bottom: 2.5rem; }
.brand { font-size: .78rem; letter-spacing: .18em; color: var(--muted); text-transform: uppercase; }
h1 { font-size: 1.9rem; line-height: 1.2; margin: .4rem 0 .5rem; font-weight: 600; }
h2 { font-size: 1.18rem; margin: 2.5rem 0 .6rem; font-weight: 600; }
h3 { font-size: 1rem; margin: 1.6rem 0 .4rem; font-weight: 600; }
p, li { color: var(--text); }
.muted { color: var(--muted); font-size: .92rem; }
a { color: var(--accent); }
ul { padding-left: 1.2rem; }
li { margin: .35rem 0; }
hr { border: 0; border-top: 1px solid var(--line); margin: 3.5rem 0; }
.lang { display: flex; gap: .5rem; margin-bottom: 2rem; }
.lang a {
  border: 1px solid var(--line); background: var(--surface);
  padding: .35rem .8rem; border-radius: 999px;
  text-decoration: none; font-size: .88rem; color: var(--muted);
}
.lang a.on { color: var(--text); border-color: var(--text); }
.card {
  background: var(--surface); border: 1px solid var(--line);
  border-radius: 14px; padding: 1rem 1.2rem; margin: 1.2rem 0;
}
.card p:first-child { margin-top: 0; }
.card p:last-child { margin-bottom: 0; }
footer { margin-top: 4rem; color: var(--muted); font-size: .88rem; }

.doc { display: block; margin: .75rem 0; padding: 1rem 1.2rem; background: var(--surface);
       border: 1px solid var(--line); border-radius: 14px; text-decoration: none; color: var(--text); }
.doc span { display: block; color: var(--muted); font-size: .92rem; margin-top: .15rem; }
</style>
</head>
<body>
<main>
  <header>
    <div class="brand">PROJECT50</div>
    <h1>Yasal belgeler · Legal</h1>
    <p class="muted">50 günlük challenge uygulaması · The 50-day challenge app</p>
  </header>

  <a class="doc" href="privacy.html">Gizlilik Politikası / Privacy Policy
    <span>Uygulamanın ne topladığı — ve neyi toplamadığı.</span></a>

  <a class="doc" href="terms.html">Kullanım Koşulları / Terms of Use
    <span>Abonelikler, içeriğin, ve sağlık uyarısı.</span></a>

  <footer>
    <p><a href="mailto:projectfiftychallenge@gmail.com">projectfiftychallenge@gmail.com</a></p>
  </footer>
</main>
</body>
</html>
